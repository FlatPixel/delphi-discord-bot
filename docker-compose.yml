services:
  delphi-bot:
    build: .
    image: delphi-bot:latest
    container_name: delphi-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persistent SQLite database on the server
      - ./data:/data
    # No ports exposed: the bot only makes outbound connections to Discord.
    # The server stays invisible from the internet for this service.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
